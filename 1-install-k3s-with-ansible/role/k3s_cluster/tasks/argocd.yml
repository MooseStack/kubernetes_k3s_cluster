---
- name: Validate Argo CD install state
  ansible.builtin.assert:
    that:
      - argocd_install_state | lower in ['install', 'remove']
    fail_msg: "argocd_install_state must be install or remove"

- name: Check whether the k3s CLI exists before removing Argo CD
  ansible.builtin.command:
    argv:
      - k3s
      - --version
  register: k3s_cli_status
  changed_when: false
  failed_when: false
  when: argocd_install_state | lower == 'remove'

- name: Skip Argo CD removal when the k3s CLI is not installed
  ansible.builtin.debug:
    msg: "Skipping Argo CD removal because the k3s CLI is not installed"
  when:
    - argocd_install_state | lower == 'remove'
    - k3s_cli_status.rc | default(1) != 0

- name: Remove Argo CD if state is remove
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_version: "{{ argocd_chart_version }}"
    kubeconfig: "{{ controller_kubeconfig }}"
    release_namespace: argocd
    create_namespace: false
    state: absent
  when:
    - argocd_install_state | lower == 'remove'
    - k3s_cli_status.rc | default(1) == 0

- name: Remove Helm if Argo CD state is remove
  ansible.builtin.file:
    path: /usr/local/bin/helm
    state: absent
  when: argocd_install_state | lower == 'remove'

- name: Check whether Argo CD is already installed
  ansible.builtin.command:
    argv:
      - helm
      - --kubeconfig
      - "{{ controller_kubeconfig }}"
      - status
      - argocd
      - --namespace
      - argocd
  register: argocd_release_status
  changed_when: false
  failed_when: false
  when: argocd_install_state | lower == 'install'

- name: Install and configure Argo CD
  when:
    - argocd_install_state | lower == 'install'
    - argocd_release_status.rc != 0
  block:
    - name: Install Argo CD
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo-cd
        chart_repo_url: https://argoproj.github.io/argo-helm
        chart_version: "{{ argocd_chart_version }}"
        kubeconfig: "{{ controller_kubeconfig }}"
        release_namespace: argocd
        create_namespace: true
        state: present

    - name: Wait for Argo CD server
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ controller_kubeconfig }}"
          - rollout
          - status
          - deployment/argocd-server
          - --namespace
          - argocd
          - --timeout=600s

- name: Read Argo CD admin secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ controller_kubeconfig }}"
      - get
      - secret
      - argocd-initial-admin-secret
      - --namespace
      - argocd
      - --output=jsonpath={.data.password}
  register: argocd_secret
  no_log: true
  changed_when: false
  when: argocd_install_state | lower == 'install'

- name: Decode Argo CD password
  ansible.builtin.set_fact:
    argocd_password: "{{ argocd_secret.stdout | b64decode }}"
  no_log: true
  when: argocd_install_state | lower == 'install'

- name: Display Argo CD UI port-forward command
  ansible.builtin.debug:
    msg: |
      "Run 'kubectl --kubeconfig <your-KUBECONFIG> port-forward --namespace argocd service/argocd-server 8443:443'"
      "On local browser. access Argo CD UI at https://localhost:8443"
      "The ArgoCD initial credentials is:"
      "Username: 'admin' , and password: '{{ argocd_password }}'"
  when: argocd_install_state | lower == 'install'
