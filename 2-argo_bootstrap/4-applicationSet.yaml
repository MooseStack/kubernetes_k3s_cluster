apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-infra-applicationset
  namespace: argocd

spec:
  goTemplate: true

  # Generator: create the Argo CD Application for the active k3s infrastructure.
  generators:
    - git:
        repoURL: "https://github.com/MooseStack/kubernetes_k3s_cluster.git"
        revision: main
        directories:
          - path: "gitops/infra/argocd"
          - path: "gitops/infra/clusterwide"
          - path: "gitops/infra/components/*"

  # Template for generated ArgoCD Applications
  template:
    metadata:
      name: "gitops-infra-{{.path.basename}}"

    spec:
      project: "gitops-infra"

      source:
        repoURL: "https://github.com/MooseStack/kubernetes_k3s_cluster.git"
        targetRevision: HEAD
        path: "{{.path.path}}"

      destination:
        server: "https://kubernetes.default.svc"
        # Clusterwide resources use the existing default namespace; other
        # components use the namespace matching their directory.
        namespace: >-
          {{- if eq .path.basename "clusterwide" -}}
          default
          {{- else -}}
          {{ .path.basename }}
          {{- end -}}

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/managed-by: argocd
            argocd.argoproj.io/managed-by: argocd

        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

        retry:
          limit: 2

  # Ignore the automated field to allow manual disabling
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy/automated