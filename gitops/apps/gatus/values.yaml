persistence:
  enabled: true

envFrom:
  - secretRef:
      name: smtp-secret

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  hosts:
    - gatus.homelab
  tls:
    - secretName: gatus-tls
      hosts:
        - gatus.homelab

config:
  storage:
    type: sqlite
    path: /data/data.db
    
  alerting:
    email:
      to: ${SMTP_TO}
      from: ${SMTP_FROM}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      host: ${SMTP_HOST}
      port: ${SMTP_PORT}
      default-alert:
        enabled: true
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "Health check failed"
    
  endpoints:

    - name: Headlamp
      url: https://headlamp.homelab
      client:
        insecure: true
      conditions:
        - '[STATUS] == 200'
      alerts:
        - type: email


    - name: Immich
      url: https://immich.homelab
      client:
        insecure: true
      conditions:
        - '[STATUS] == 200'
      alerts:
        - type: email