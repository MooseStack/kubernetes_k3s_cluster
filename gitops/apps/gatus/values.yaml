persistence:
  enabled: true

envFrom:
  - secretRef:
      name: smtp-secret

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  hosts:
    - gatus.homelab
  tls:
    - secretName: gatus-tls
      hosts:
        - gatus.homelab

config:
  storage:
    type: sqlite
    path: /data/data.db
    
  alerting:
    email:
      to: ${SMTP_TO}
      from: ${SMTP_FROM}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      host: ${SMTP_HOST}
      port: ${SMTP_PORT}
      default-alert:
        enabled: true
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "Health check failed"
  
  ## YAML Anchor for defaults to be passed down to each endpoint
  default-endpoint: &endpoint-defaults
    interval: 5m
    client:
      insecure: true
    alerts:
      - type: email

  endpoints:
    - name: Headlamp
      <<: *endpoint-defaults
      url: https://headlamp.homelab
      conditions:
        - '[STATUS] == 200'


    - name: Immich
      <<: *endpoint-defaults
      url: https://immich.homelab
      conditions:
        - '[STATUS] == 200'