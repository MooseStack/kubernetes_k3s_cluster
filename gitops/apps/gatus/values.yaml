persistence:
  enabled: true

envFrom:
  - secretRef:
      name: smtp-secret

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  hosts:
    - gatus.homelab
  tls:
    - secretName: gatus-tls
      hosts:
        - gatus.homelab

config:
  alerting:
    email:
      to: ${SMTP_TO}
      from: ${SMTP_FROM}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      host: ${SMTP_HOST}
      port: ${SMTP_PORT}

  storage:
    type: sqlite
    path: /data/data.db
    
  endpoints:
    - name: Example
      url: https://example.com
      conditions:
        - '[STATUS] == 200'

    - name: Headlamp
      url: https://headlamp.homelab
      client:
        insecure: true
      conditions:
        - '[STATUS] == 200'
      alerts:
        - type: email
          description: "Headlamp is unavailable"
          failure-threshold: 3
