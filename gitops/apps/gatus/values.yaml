persistence:
  enabled: true

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  hosts:
    - gatus.homelab
  tls:
    - secretName: gatus-tls
      hosts:
        - gatus.homelab

config:
  storage:
    type: sqlite
    path: /data/data.db
    
  endpoints:
    - name: Example
      url: https://example.com
      conditions:
        - '[STATUS] == 200'
