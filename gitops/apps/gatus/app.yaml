project: gatus

sources:
  # Deploy vanilla manifests before the Gatus Helm chart
  - repoURL: https://github.com/MooseStack/kubernetes_k3s_cluster.git
    targetRevision: main
    path: gitops/apps/gatus/manifests

  # Deploy Gatus Helm Chart with my custom values file
  - repoURL: https://twin.github.io/helm-charts
    chart: gatus
    targetRevision: 1.5.0
    helm:
      valueFiles:
        - $values/gitops/apps/gatus/values.yaml
  - repoURL: https://github.com/MooseStack/kubernetes_k3s_cluster.git
    targetRevision: main
    ref: values

ignoreDifferences:
  - group: ""
    kind: Secret
    name: smtp-secret
    jsonPointers:
      - /data
      - /stringData
