project: immich

sources:
  # Deploy vanilla manifests before the Immich Helm chart
  - repoURL: https://github.com/MooseStack/kubernetes_k3s_cluster.git
    targetRevision: main
    path: gitops/apps/immich/manifests

  # Deploy Immich Helm Chart with my custom values file
  - repoURL: ghcr.io/immich-app/immich-charts
    chart: immich
    targetRevision: 0.13.2
    helm:
      valueFiles:
        - $values/gitops/apps/immich/values.yaml
  - repoURL: https://github.com/MooseStack/kubernetes_k3s_cluster.git
    targetRevision: main
    ref: values
