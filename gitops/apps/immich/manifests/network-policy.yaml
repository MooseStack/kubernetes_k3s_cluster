## Allow egress within the namespace and to cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-allpods-only-within-namespace-and-dns
spec:
  podSelector: {} #all pods
  policyTypes:
    - Egress
  egress:
    # all pods can reach each other within the namespace
    - to:
        - podSelector: {}
    # All pods can reach the cluster DNS service in the kube-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---

# Allow the CloudNativePG cluster HTTPS egress to the API server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-database-to-apiserver
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: immich-database
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32 # k3s reserves this ip for the API server, which is not in any namespace (systemd service)
      ports:
        - protocol: TCP
          port: 443
