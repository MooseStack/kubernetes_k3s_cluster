apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-apps-applicationset
  namespace: argocd
spec:
  goTemplate: true

  generators:
    - git:
        repoURL: https://github.com/MooseStack/kubernetes_k3s_cluster.git
        revision: main
        files:
          - path: gitops/apps/*/app.yaml

  template:
    metadata:
      name: '{{ "{{.path.basename}}" }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: apps

    spec:
      project: '{{ "{{.path.basename}}" }}'
      sources: []
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ "{{.path.basename}}" }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/managed-by: argocd
            argocd.argoproj.io/managed-by: argocd
            
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true

  templatePatch: |
    spec:
      sources:
        {{ "{{- toYaml .sources | nindent 8 }}" }}
      {{ "{{- with .ignoreDifferences }}" }}
      ignoreDifferences:
        {{ "{{- toYaml . | nindent 8 }}" }}
      {{ "{{- end }}" }}

  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy/automated
