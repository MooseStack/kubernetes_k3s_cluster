{{- range .Values.repositories }}
apiVersion: v1
kind: Secret
metadata:
  name: argo-gitrepo-{{ .name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    managed-by: argocd.argoproj.io
stringData:
{{ with .project }}
  project: {{ . }}
{{ end }}
  type: {{ default "git" .type }}
  url: {{ .url }}
{{ with .enableOCI }}
  enableOCI: "true"
{{ end }}
type: Opaque
---
{{- end }}
