projects:
  - name: app-of-apps
    description: Argo CD project for GitOps infrastructure resources managed by the infrastructure ApplicationSet
    sourceRepos:
      - https://github.com/MooseStack/kubernetes_k3s_cluster.git
    destinations:
      - namespace: "*"
        server: https://kubernetes.default.svc
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"

  - name: apps
    description: Argo CD project for namespace-scoped applications generated from gitops/apps
    sourceRepos:
      - https://github.com/MooseStack/kubernetes_k3s_cluster.git
      - https://github.com/MooseStack/tailscale_helm.git
      - "*"
    destinations:
      - namespace: "*"
        server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  - name: immich
    description: Argo CD project for Immich applications
    sourceRepos:
      - "*"
    destinations:
      - namespace: immich
        server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  - name: pgvector
    description: Argo CD project for pgvector applications
    sourceRepos:
      - "*"
    destinations:
      - namespace: pgvector
        server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

repositories:
  - name: app-of-apps
    project: app-of-apps
    url: https://github.com/MooseStack/kubernetes_k3s_cluster.git
