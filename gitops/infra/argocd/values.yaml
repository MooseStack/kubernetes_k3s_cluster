projects:

  - name: apps
    description: Argo CD project for namespace-scoped applications generated from gitops/apps
    sourceRepos:
      - "*"
    destinations:
      - namespace: "*"
        server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  - name: immich
    description: Argo CD project for Immich applications
    sourceRepos:
      - "*"
    destinations:
      - namespace: immich
        server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

  - name: pgvector
    description: Argo CD project for pgvector applications
    sourceRepos:
      - "*"
    destinations:
      - namespace: pgvector
        server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

repositories:
  - name: apps
    project: apps
    url: https://github.com/MooseStack/kubernetes_k3s_cluster.git
