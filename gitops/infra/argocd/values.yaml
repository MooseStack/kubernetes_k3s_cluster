argocd:
  # Values for the upstream argo-cd Helm chart.
  configs:
    params:
      # Keep TLS enabled on the Argo CD API server.
      server.insecure: true # will use cert

  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      path: /
      hostname: argocd.homelab
      annotations:
        cert-manager.io/cluster-issuer: selfsigned
      labels: {}
      tls: false
      extraTls:
        - secretName: argocd-tls
          hosts:
            - argocd.homelab

projects:
  - name: gitops-apps
    description: Argo CD project for applications managed under gitops/apps
    sourceRepos:
      - https://github.com/MooseStack/kubernetes_k3s_cluster.git
    destinations:
      - namespace: "*"
        server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
  - name: tailscale
    description: Argo CD project for tailscale application
    sourceRepos:
      - https://github.com/MooseStack/tailscale_helm.git
      - https://github.com/MooseStack/kubernetes_k3s_cluster.git
    destinations:
      - namespace: tailscale
        server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
        name: "tailscale"
